[workspace]
resolver = "2"
members = [
    "crates/types",
    "crates/store",
    "crates/state",
    "crates/raft",
    "crates/services",
    "crates/server",
    "crates/sdk",
    "crates/test-utils",
    "crates/consensus",
    "crates/profile",
    "crates/fs",
    "crates/wire",
    "crates/wire-macro",
    "crates/wire-services",
    "crates/wire-transport",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/inferadb/ledger"
authors = ["InferaDB Contributors"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
tokio-stream = "0.1"
tokio-util = "0.7"

# gRPC types — only the lightweight `Status` / `Code` / `Request` shells
# are still consumed (by `services::wire_helpers` and a few legacy adapter
# shims that bridge `tonic::Status` into `WireError`). The full gRPC server
# transport, protobuf codegen, and reflection were dropped in F.2.h.23.
# tls-ring: use ring crypto instead of slow-to-compile aws-lc
# tls-native-roots: load system CA certificates (needed by SDK)
tonic = { version = "0.14", features = ["gzip", "zstd", "tls-ring", "tls-native-roots"] }
tower = { version = "0.5", features = ["limit", "load-shed", "timeout"] }

# Crypto
sha1 = "0.11"
sha2 = "0.11"
seahash = "4"
blake3 = "1"
hmac = "0.13"
rs_merkle = "1"
subtle = "2"
base64 = "0.22"
aes-gcm = "0.10"
aes-kw = "0.2"
zeroize = { version = "1", features = ["derive"] }
bcrypt = "0.19"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core", "zeroize"] }
# JWT: rust_crypto backend provides CryptoProvider auto-registration; ed25519-dalek for EdDSA
jsonwebtoken = { version = "10", features = ["rust_crypto"] }

# Compression
zstd = "0.13"
async-compression = { version = "0.4", features = ["tokio", "zstd"] }

# Archive (tar) — used by the multi-DB backup archive format
tar = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
rkyv = { version = "0.8", features = ["alloc", "bytecheck"] }
schemars = "1"

# Error handling
snafu = "0.9"
thiserror = "2"

# Parallelism
rayon = "1.10"

# Concurrency
parking_lot = "0.12"
arc-swap = "1"
im = { version = "15", features = ["serde"] }
dashmap = "6"

# Caching
moka = { version = "0.12", features = ["sync"] }

# Builder pattern
bon = "3"

# Utilities
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics and observability
metrics = "0.24"
# Disable push-gateway (default) to avoid hyper-rustls/aws-lc-sys dependency
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }

# OpenTelemetry (OTLP export for canonical log lines)
opentelemetry = "0.31"
opentelemetry_sdk = "0.32"
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.32"

# Configuration
clap = { version = "4", features = ["derive", "env"] }
humantime = "2"
humantime-serde = "1"

# File locking
fs2 = "0.4"

# Low-level syscall FFI — used ONLY by `inferadb-ledger-fs` to wrap
# macOS `fcntl(F_BARRIERFSYNC)`. No other crate should depend on libc.
libc = "0.2"

# Proc-macro authoring (used by `crates/wire-macro`)
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing", "printing", "extra-traits"] }

# Testing
tempfile = "3"
rand = "0.10"
futures = "0.3"
proptest = "1"
serial_test = "3"
trybuild = "1"


# DNS resolver for A record discovery
hickory-resolver = "0.25"

# Object Storage (S3, GCS, Azure, local)
object_store = { version = "0.13", features = ["aws", "gcp", "azure"] }

async-trait = "0.1"

# Network simulation testing
turmoil = "0.7"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
async-stream = "0.3"

# QUIC transport (custom wire protocol)
# quinn 0.11 default features: [log, platform-verifier, runtime-tokio, rustls-ring, bloom].
# We accept defaults — they give us tokio runtime + rustls/ring crypto provider, matching
# the rest of the workspace's preference for `ring` over `aws-lc-sys`.
quinn = "0.11"
# rustls 0.23 defaults pull in `aws_lc_rs`, which conflicts with quinn's `rustls-ring`
# provider and adds the slow-to-compile aws-lc-sys C dep. We disable defaults and select
# `ring` explicitly so quinn and any direct rustls use share one CryptoProvider.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
# PEM parsing for the operator-supplied wire TLS cert + key paths (F.1.d).
# Defaults pull in std-only PEM parsing — exactly what we need.
rustls-pemfile = "2"
# Self-signed cert generation for ephemeral test endpoints (used in wire-transport
# integration tests). Default features include `ring`, matching the chosen rustls provider.
rcgen = "0.13"

# Internal crates
# - `version + path` — crate is published to crates.io (consumed by external SDK users).
# - `path` only     — internal-only crate, not published.
inferadb-ledger-types = { version = "0.1.0", path = "crates/types" }
inferadb-ledger-sdk = { version = "0.1.0", path = "crates/sdk" }
inferadb-ledger-store = { path = "crates/store" }
inferadb-ledger-state = { path = "crates/state" }
inferadb-ledger-raft = { path = "crates/raft" }
inferadb-ledger-consensus = { path = "crates/consensus" }
inferadb-ledger-services = { path = "crates/services" }
inferadb-ledger-server = { path = "crates/server" }
inferadb-ledger-test-utils = { path = "crates/test-utils" }
inferadb-ledger-profile = { path = "crates/profile" }
inferadb-ledger-fs = { path = "crates/fs" }
inferadb-ledger-wire = { path = "crates/wire" }
inferadb-ledger-wire-macro = { path = "crates/wire-macro" }
inferadb-ledger-wire-services = { path = "crates/wire-services" }
inferadb-ledger-wire-transport = { path = "crates/wire-transport" }

# Hashing (for inferadb-ledger-store)
xxhash-rust = { version = "0.8", features = ["xxh32", "xxh3"] }
byteorder = "1"
crc32fast = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 1

[profile.profiling]
inherits = "release"
debug = true
strip = false
