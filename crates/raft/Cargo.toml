[package]
name = "inferadb-ledger-raft"
description = "Raft consensus and gRPC services for InferaDB Ledger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
documentation = "https://docs.rs/inferadb-ledger-raft"
readme = "README.md"
keywords = ["raft", "consensus", "distributed", "grpc", "ledger"]
categories = ["network-programming", "asynchronous"]

[dependencies]
# Internal
inferadb-ledger-types.workspace = true
inferadb-ledger-state.workspace = true
inferadb-ledger-store.workspace = true
inferadb-ledger-consensus.workspace = true
inferadb-ledger-wire.workspace = true
inferadb-ledger-wire-transport.workspace = true
inferadb-ledger-wire-services.workspace = true

# Parallelism (apply-path batched state_root + block_hash computation).
rayon.workspace = true

# QUIC streams (used by `wire_consensus_transport::peer_sender` to drive the
# bidi `Replicate` stream directly; the wire-transport crate exposes
# `read_frame` / `write_frame` over `quinn::SendStream` / `quinn::RecvStream`).
quinn.workspace = true

# Async runtime
tokio = { workspace = true, features = ["fs", "io-util", "net"] }
async-trait.workspace = true

# Concurrency
parking_lot.workspace = true
moka.workspace = true
arc-swap.workspace = true
im.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
postcard.workspace = true

# Error handling
snafu.workspace = true

# Builder pattern
bon.workspace = true

# Crypto
sha2.workspace = true
hmac.workspace = true
seahash.workspace = true
base64.workspace = true
rand.workspace = true
ed25519-dalek.workspace = true
zeroize.workspace = true
aes-gcm.workspace = true
subtle.workspace = true

# Concurrent collections
dashmap.workspace = true

# Utilities
bytes.workspace = true
chrono.workspace = true
tracing.workspace = true
uuid.workspace = true
fs2.workspace = true
tempfile.workspace = true

# Metrics
metrics.workspace = true

# OpenTelemetry (OTLP export)
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true

# Compression
async-compression.workspace = true
zstd.workspace = true

# Archive format (multi-DB backup archive)
tar.workspace = true
blake3.workspace = true

# CRC32 — Stage 3 snapshot wire transfer integrity check
crc32fast.workspace = true

# Streaming
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util.workspace = true
futures = "0.3"

[dev-dependencies]
inferadb-ledger-test-utils.workspace = true
tracing-subscriber.workspace = true
proptest.workspace = true
# Used by hot_key_detector tests to assert `ledger_hot_key_nan_total`
# increments via a scoped `DebuggingRecorder`. Already in the lock file as a
# transitive dep of `metrics-exporter-prometheus`; pinned here for the direct
# `metrics_util::debugging` path used in tests.
metrics-util = "0.20"

# Wire-transport peer-sender tests stand up an in-process QUIC server with
# self-signed certs and a no-verify client. These are dev-only; production
# deployments use real WireGuard + real certificates.
rcgen.workspace = true
rustls.workspace = true
inferadb-ledger-wire-transport = { workspace = true, features = ["insecure-skip-verify"] }

[lints]
workspace = true
