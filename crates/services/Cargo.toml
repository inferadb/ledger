[package]
name = "inferadb-ledger-services"
description = "gRPC services and server assembly for InferaDB Ledger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Internal
inferadb-ledger-types.workspace = true
inferadb-ledger-state.workspace = true
inferadb-ledger-store.workspace = true
inferadb-ledger-raft.workspace = true
inferadb-ledger-consensus.workspace = true
inferadb-ledger-wire.workspace = true
inferadb-ledger-wire-services.workspace = true
inferadb-ledger-wire-transport.workspace = true

# QUIC TLS — the wire transport's `serve_wire` path consumes a
# `rustls::ServerConfig` directly (not behind a tonic facade). Already a
# transitive dependency through `inferadb-ledger-wire-transport`, but
# named explicitly so `LedgerServer` can hold a `wire_tls_config` field.
rustls.workspace = true

# gRPC types — tonic provides Status / Request / Response shells used by
# `wire_helpers` and a few adapter shims that bridge legacy code paths into
# `WireError`. The full gRPC server transport, codegen, and reflection were
# dropped in F.2.h.23; only the lightweight `Status` / `Code` types remain.
tonic.workspace = true

# Async
tokio.workspace = true
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tokio-util.workspace = true
futures = "0.3"

# Concurrency
parking_lot.workspace = true
moka.workspace = true
arc-swap.workspace = true

# Builder pattern
bon.workspace = true

# Crypto
sha1.workspace = true
sha2.workspace = true
seahash.workspace = true
hmac.workspace = true
rand.workspace = true
bcrypt.workspace = true
ed25519-dalek.workspace = true
base64.workspace = true
jsonwebtoken.workspace = true

# Memory safety
zeroize.workspace = true
subtle.workspace = true

# Metrics
metrics.workspace = true

# Utilities
chrono.workspace = true
tracing.workspace = true
uuid.workspace = true
tempfile.workspace = true

# Serialization (used by proto_compat, runtime_config, jwt, typed proposal helpers)
serde.workspace = true
serde_json.workspace = true
postcard.workspace = true
bytes.workspace = true

# Error handling
snafu.workspace = true

[dev-dependencies]
inferadb-ledger-test-utils.workspace = true
proptest.workspace = true
# Self-signed cert generator for the `serve_wire` TLS-bridge unit test.
# Production builds never see this — it lives behind `[dev-dependencies]`.
rcgen.workspace = true

[features]
# F.1.b placeholder. Exposes `services::permissive_verifier::PermissiveVerifier`,
# a wide-open `AuthVerifier` impl used to bring up the wire transport before
# the production `JwtAuthVerifier` lands in F.1.c. Off by default — production
# builds must NOT enable this. Tests automatically pull it in via `cfg(test)`
# regardless of feature state.
permissive-wire-auth = []

[lints]
workspace = true
